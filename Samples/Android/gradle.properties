# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# LiteAVSDK VoiceAI 依赖来源开关（作用于 :VoiceAIKit 模块）
#   true  = 本地测试：使用仓库根目录 libs/ 下的 LiteAVSDK_VoiceAI aar（flatDir，api 暴露）
#   false = 对外发布：使用 Maven 坐标 com.tencent.liteav:LiteAVSDK_VoiceAI（implementation）
useLocalVoiceAiSdk=false
